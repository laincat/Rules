name: 同步到 cnb.cool

# 独立于 gen-rulesets 的镜像同步：任何 main 提交都要同步到 CNB，
# 不能只挂在规则集生成流程上（那样 README / Docs 的改动就漏掉了）。

on:
  schedule:
    # 每天一次兜底，防止某次 push 事件丢失后两边长期不一致
    - cron: "7 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  # gen-rulesets 用 GITHUB_TOKEN 自动 push 不会触发别的 workflow 的 push 事件，
  # 所以还要监听它完成后跑一次，把自动生成的规则集也同步过去。
  workflow_run:
    workflows: ["生成规则集（Ozon / AI / 去广告）"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_USER: ${{ secrets.CNB_USER }}
      CNB_REPO: laincat/Rules

    steps:
      - name: 取出仓库
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 同步到 cnb.cool（直接推 main 历史；没配 secret 就跳过）
        if: ${{ env.CNB_TOKEN != '' }}
        shell: bash
        run: |
          set -euxo pipefail
          # CNB 是 GitHub 的纯镜像，直接 force-push main，两边 history 完全一致。
          # 不用 clone+覆盖：那会在 CNB 侧造出额外的合成提交，导致两边分叉。
          CRED='!f() { echo "username='"${CNB_USER}"'"; echo "password='"${CNB_TOKEN}"'"; }; f'
          git -c credential.helper= -c credential.helper="$CRED" \
              push --force "https://cnb.cool/${CNB_REPO}.git" HEAD:main
          echo "已镜像到 cnb.cool/${CNB_REPO}（main 指向 $(git rev-parse --short HEAD)）"

      # CNB 仓库此前只被 force-push 分支历史，从不创建 Release —— 那边 releases
      # 页面一直是空的。这里把 GitHub Release 的附件逐个镜像过去：CNB 没有
      # releases/latest 别名，所以固定 tag `latest`，靠覆盖同名附件换稳定直链。
      # 缺 CNB_TOKEN 时整步跳过，与上面的 git 同步保持一致。
      - name: 镜像 Release 附件到 cnb.cool
        if: ${{ env.CNB_TOKEN != '' }}
        shell: bash
        env:
          CNB_REPO_SLUG: ${{ env.CNB_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/cnb-assets"
          mkdir -p "$STAGE"
          if ! gh release view latest >/dev/null 2>&1; then
            echo "GitHub 侧还没有 latest Release，本轮跳过附件镜像"
            exit 0
          fi
          # 逐个附件下载，保持扁平文件名 —— CNB 直链就是 .../download/<tag>/<文件名>。
          # 不含 .tar.gz：那边只要可直接引用的单文件。
          gh release view latest --json assets \
            --jq '.assets[] | select(.name | endswith(".tar.gz") | not) | .name' \
            | while read -r name; do
                [ -n "$name" ] || continue
                gh release download latest --pattern "$name" --dir "$STAGE" --clobber
              done
          count=$(find "$STAGE" -type f | wc -l)
          echo "待镜像附件 $count 个"
          if [ "$count" -eq 0 ]; then
            echo "GitHub Release 没有可镜像的附件"
            exit 0
          fi
          python tools/publish_cnb_release.py --files-dir "$STAGE" --tag latest --ttl 0

      - name: 未配置 secret（跳过）
        if: ${{ env.CNB_TOKEN == '' }}
        shell: bash
        run: |
          echo "CNB_TOKEN 未配置，跳过同步"
