name: 同步到 cnb.cool

# 独立于 gen-rulesets 的镜像同步：任何 main 提交都要同步到 CNB，
# 不能只挂在规则集生成流程上（那样 README / Docs 的改动就漏掉了）。

on:
  schedule:
    # 每天一次兜底，防止某次 push 事件丢失后两边长期不一致
    - cron: "7 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  # 规则集生成和文档巡检用 GITHUB_TOKEN 自动 push，不会触发其他 workflow 的 push 事件，
  # 所以也监听它们完成后运行，把自动生成的规则集及文档更新同步过去。
  workflow_run:
    workflows: ["生成规则集（Ozon / AI / 去广告）", "知识库上游巡检"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sync-cnb
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_USER: ${{ secrets.CNB_USER }}
      CNB_REPO: laincat/Rules

    steps:
      - name: 取出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: 同步到 cnb.cool（直接推 main 历史；没配 secret 就跳过）
        if: ${{ env.CNB_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          # Refresh at execution time: reruns must never mirror an old event SHA.
          git fetch origin main
          git checkout --detach origin/main
          SOURCE=$(git rev-parse HEAD)
          CRED='!f() { echo "username='"${CNB_USER}"'"; echo "password='"${CNB_TOKEN}"'"; }; f'
          REMOTE="https://cnb.cool/${CNB_REPO}.git"
          EXPECT=$(git -c credential.helper= -c credential.helper="$CRED" ls-remote "$REMOTE" refs/heads/main | cut -f1)
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$SOURCE" = "$CURRENT" ] || { echo "main advanced; retry from latest main"; exit 1; }
          git -c credential.helper= -c credential.helper="$CRED" \
            push --force-with-lease="refs/heads/main:$EXPECT" "$REMOTE" "$SOURCE:refs/heads/main"
          echo "Mirrored source SHA: $SOURCE" >> "$GITHUB_STEP_SUMMARY"

      # CNB 仓库此前只被 force-push 分支历史，从不创建 Release —— 那边 releases
      # 页面一直是空的。这里把 GitHub Release 的附件逐个镜像过去：CNB 没有
      # releases/latest 别名，所以固定 tag `latest`，靠覆盖同名附件换稳定直链。
      # 缺 CNB_TOKEN 时整步跳过，与上面的 git 同步保持一致。
      - name: 镜像 Release 附件到 cnb.cool
        if: ${{ env.CNB_TOKEN != '' }}
        shell: bash
        env:
          CNB_REPO_SLUG: ${{ env.CNB_REPO }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/cnb-assets"
          mkdir -p "$STAGE"
          if ! gh release view latest >/dev/null 2>&1; then
            echo "GitHub 侧还没有 latest Release，本轮跳过附件镜像"
            exit 0
          fi
          python tools/release_snapshot.py fetch "$STAGE"
          count=$(find "$STAGE" -type f | wc -l)
          echo "待镜像附件 $count 个"
          if [ "$count" -eq 0 ]; then
            echo "GitHub Release 没有可镜像的附件"
            exit 0
          fi
          python tools/publish_cnb_release.py --files-dir "$STAGE" --tag latest --ttl 0

      - name: 未配置 secret（跳过）
        if: ${{ env.CNB_TOKEN == '' }}
        shell: bash
        run: |
          echo "CNB_TOKEN 未配置，跳过同步"

