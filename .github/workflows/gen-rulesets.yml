name: 生成规则集（Ozon / AI）

# 每天抓上游、重算规则集，有变化就自动提交并推送。
# 与 docs-watch.yml 的分工: 那边只回答「上游变了没有」（开 issue 等人判断）,
# 这边数据是纯机械合并（去重/清洗），变化本身就是可接受的结果，所以直接提交。

on:
  schedule:
    # 每天一次，避开整点（GitHub cron 整点丢槽）；比 docs-watch 晚 25 分钟，错峰
    - cron: "42 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_rulesets.py"
      - ".github/workflows/gen-rulesets.yml"

permissions:
  contents: write

concurrency:
  group: gen-rulesets
  cancel-in-progress: false

jobs:
  gen:
    strategy:
      matrix:
        include:
          # 两个 runner 互为对照: 任一平台抓取失败或内容被 CDN 污染, 对比步骤就会失败
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: 取出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 下载 mihomo
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)"
          BASE="https://github.com/MetaCubeX/mihomo/releases/download/v${VERSION}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o mihomo.zip "${BASE}/mihomo-windows-amd64-v${VERSION}.zip"
            unzip -o mihomo.zip mihomo-windows-amd64.exe
            echo "MIHOMO=./mihomo-windows-amd64.exe" >> "$GITHUB_ENV"
          else
            curl -fsSL -o mihomo.gz "${BASE}/mihomo-linux-amd64-compatible-v${VERSION}.gz"
            gzip -dc mihomo.gz > mihomo && chmod +x mihomo
            echo "MIHOMO=./mihomo" >> "$GITHUB_ENV"
          fi

      - name: 生成规则集
        shell: bash
        run: |
          set -euxo pipefail
          # --stamp 用北京时间写进文件头；内容未变时生成器会沿用旧时间戳（幂等）
          python tools/gen_rulesets.py --write --mihomo "$MIHOMO" --stamp "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"

      - name: 摘要
        if: runner.os == 'Linux'
        shell: bash
        run: |
          {
            echo "### 规则集生成 $(date -u '+%Y-%m-%d')"
            echo
            echo '| 文件 | 条目 | 大小 |'
            echo '|---|---|---|'
            for f in Surge/Advertising/Advertising.list Surge/Advertising/Advertising.Extra.list Surge/Advertising/Comics.list \
                     Surge/Ruleset/AI.list Surge/Ruleset/AI.Extra.list \
                     Surge/Ruleset/Ozon.list Surge/Ruleset/Ozon.Extra.list \
                     Mihomo/Ruleset/AI.Extra.yaml Mihomo/Ruleset/Ozon.Extra.yaml \
                     Mihomo/Advertising/Advertising.Extra.yaml Mihomo/Advertising/Comic.yaml; do
              n="$(grep -cEv '^\s*(#|$)' "$f" || true)"
              s="$(wc -c < "$f")"
              echo "| \`$f\` | $n | ${s}B |"
            done
            for f in Mihomo/Advertising/Advertising.mrs Mihomo/Ruleset/AI.mrs Mihomo/Ruleset/Ozon.mrs; do
              s="$(wc -c < "$f")"
              echo "| \`$f\` | — | ${s}B |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交并推送
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A 覆盖改名/删除（旧命名的 AI.yaml / Ozon.yaml / Advertising.yaml 会被自动 stage 删除）
          git add -A Surge/Ruleset Surge/Advertising Mihomo/Ruleset Mihomo/Advertising
          if git diff --cached --quiet; then
            echo "规则集无变化"
            exit 0
          fi
          git commit -m "chore(ruleset): 自动刷新 Ozon / AI 规则集 $(date -u '+%Y-%m-%d')"
          git push
