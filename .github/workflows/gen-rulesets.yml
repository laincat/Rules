name: 生成规则集（Ozon / AI / 去广告）

# 每天抓上游、重算规则集，有变化就自动提交、滚动发布 Release。
# CNB 镜像同步由独立的 sync-cnb.yml 负责，任何 main 提交都会触发。
# 与 docs-watch.yml 的分工: 那边只回答「上游变了没有」（开 issue 等人判断）,
# 这边数据是纯机械合并（去重/清洗），变化本身就是可接受的结果，所以直接提交。

on:
  schedule:
    # 每天一次，避开整点（GitHub cron 整点丢槽）；比 docs-watch 晚 25 分钟，错峰
    - cron: "42 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_rulesets.py"
      - "tools/rule_validation.py"
      - "tools/tests/**"
      - "tools/gen_diff.py"
      - "tools/gen_diff_chart.py"
      - ".github/workflows/gen-rulesets.yml"

permissions:
  contents: write

concurrency:
  group: gen-rulesets
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0          # 算 diff 需要上一版历史

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 校验清洗与误拦截保护
        run: python -m unittest discover -s tools/tests -v

      - name: 下载 mihomo
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)"
          BASE="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}"
          curl -fsSL -o mihomo.gz "${BASE}/mihomo-linux-amd64-compatible-${VERSION}.gz"
          gzip -dc mihomo.gz > mihomo && chmod +x mihomo
          echo "MIHOMO=./mihomo" >> "$GITHUB_ENV"

      - name: 生成规则集
        shell: bash
        run: |
          set -euxo pipefail
          # --stamp 用北京时间写进文件头；内容未变时生成器会沿用旧时间戳（幂等）
          python tools/gen_rulesets.py --write --mihomo "$MIHOMO" --stamp "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" --report "$RUNNER_TEMP/rules-validation.json"
          cat "$RUNNER_TEMP/rules-validation.json"

      - name: 计算差异（commit 前，对比 HEAD vs 工作区）
        id: diff
        shell: bash
        run: |
          set -euxo pipefail
          python tools/gen_diff.py --pre HEAD --out diff.json --md DIFF.md
          # 差异直接写进下方 release 的说明文字，不再依赖 diff.svg 附件。

      - name: 摘要
        shell: bash
        run: |
          {
            echo "### 规则集生成 $(date -u '+%Y-%m-%d')"
            echo
            echo '| 文件 | 条目 | 大小 |'
            echo '|---|---|---|'
            for f in Surge/Advertising/Advertising.list Surge/Advertising/Advertising.Extra.list \
                     Surge/Ruleset/AI.list Surge/Ruleset/AI.Extra.list \
                     Surge/Ruleset/Ozon.list Surge/Ruleset/Ozon.Extra.list \
                     Mihomo/Ruleset/AI.Extra.yaml Mihomo/Ruleset/Ozon.Extra.yaml \
                     Mihomo/Advertising/Advertising.Extra.yaml; do
              n="$(grep -cEv '^\s*(#|$)' "$f" || true)"
              s="$(wc -c < "$f")"
              echo "| \`$f\` | $n | ${s}B |"
            done
            for f in Mihomo/Advertising/Advertising.mrs Mihomo/Ruleset/AI.mrs Mihomo/Ruleset/Ozon.mrs; do
              s="$(wc -c < "$f")"
              echo "| \`$f\` | — | ${s}B |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交并推送
        id: commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "publishable=false" >> "$GITHUB_OUTPUT"
          git add -A Surge/Ruleset Surge/Advertising Mihomo/Ruleset Mihomo/Advertising
          if git diff --cached --quiet; then
            echo "规则集无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(ruleset): 自动刷新规则集 $(date -u '+%Y-%m-%d')"
          # 先 rebase 到远端最新再推；fast-forward 冲突时（与 docs-watch 并发，
          # 或两次 gen-rulesets 撞车）直接放弃本次提交 —— 规则集是幂等生成的，
          # 下次调度会从一致的上游重新算出同一份内容，不在这里死磕冲突。
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort
            echo "rebase 冲突，放弃本次提交（下次调度重跑）"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push; then
            echo "push 失败，放弃本次提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "publishable=true" >> "$GITHUB_OUTPUT"

      - name: 滚动发布 Release（固定 tag，永远只留一个）
        id: release
        if: steps.commit.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="latest"

          # 两个包各自独立滚动：变化哪个就覆盖哪个，没变的保留旧附件。
          # tar 归一化排序/时间/属主，gzip -n 去掉时间戳，保证同内容同 sha256。
          mkdir -p release-assets
          (cd Surge && tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf ../release-assets/Surge.tar Module)
          (cd release-assets && gzip -n -c Surge.tar > modules.tar.gz && rm Surge.tar)
          # 规则包保留 Surge/ 与 Mihomo/ 顶层目录，内的相对路径与仓库一致，
          # 这样 Raw 地址与压缩包内路径可直接对照。
          mkdir -p release-assets/Rulesets/Surge release-assets/Rulesets/Mihomo
          cp -r Surge/Advertising Surge/Ruleset release-assets/Rulesets/Surge/
          cp -r Mihomo/Advertising Mihomo/Ruleset release-assets/Rulesets/Mihomo/
          (cd release-assets/Rulesets && tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - Mihomo Surge | gzip -n > ../rulesets.tar.gz)

          exists=false
          if gh release view "$TAG" >/dev/null 2>&1; then exists=true; fi
          want_modules=$(sha256sum release-assets/modules.tar.gz | awk '{print $1}')
          want_rulesets=$(sha256sum release-assets/rulesets.tar.gz | awk '{print $1}')

          digest() {
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
              --jq --arg name "$1" '.assets[] | select(.name==$name) | (.digest // "")' \
              2>/dev/null | sed 's|^sha256:||' || true
          }

          update_modules=no; update_rulesets=no
          if [ "$exists" != "true" ]; then
            update_modules=yes; update_rulesets=yes
          else
            [ "$(digest modules.tar.gz)" = "$want_modules" ] || update_modules=yes
            [ "$(digest rulesets.tar.gz)" = "$want_rulesets" ] || update_rulesets=yes
          fi
          if [ "$update_modules" = no ] && [ "$update_rulesets" = no ]; then
            echo "两个包内容都未变（modules ${want_modules:0:16}… / rulesets ${want_rulesets:0:16}…），跳过"
            exit 0
          fi

          SHA=$(git rev-parse HEAD)
          git tag -f "$TAG" "$SHA"
          git push -f origin "refs/tags/$TAG"

          # 发行版说明 = 固定说明 + 本次差异报告正文。
          # --notes-file 读文件、不经过 shell 转义，多行 markdown 原样保留。
          {
            echo "本 Release 的 tag 固定为 \`latest\`，两个包各自独立滚动覆盖："
            echo
            echo "- \`modules.tar.gz\` —— Surge 模块（\`Surge/Module/\`，手工维护，订阅直接引用）"
            echo "- \`rulesets.tar.gz\` —— 自动生成的规则集（去广告 / AI / Ozon，Surge 与 mihomo）"
            echo
            echo "固定下载地址："
            echo
            echo '```'
            echo "https://github.com/laincat/Rules/releases/latest/download/modules.tar.gz"
            echo "https://github.com/laincat/Rules/releases/latest/download/rulesets.tar.gz"
            echo '```'
            echo
            echo "变化哪个就覆盖哪个；压缩包内路径与仓库 main 分支一致。"
            echo
            echo "---"
            echo
            cat DIFF.md
          } > release-notes.md

          if [ "$exists" = "true" ]; then
            [ "$update_modules" = yes ] && gh release upload "$TAG" release-assets/modules.tar.gz --clobber
            [ "$update_rulesets" = yes ] && gh release upload "$TAG" release-assets/rulesets.tar.gz --clobber
            gh release edit "$TAG" --notes-file release-notes.md
            echo "已滚动覆盖 release（tag $TAG -> ${SHA:0:7}）：modules=$update_modules rulesets=$update_rulesets"
          else
            gh release create "$TAG" release-assets/modules.tar.gz release-assets/rulesets.tar.gz \
              --title "最新规则集（滚动更新）" \
              --notes-file release-notes.md \
              --latest
            echo "已创建 release：$TAG"
          fi

      - name: 小结
        if: always()
        shell: bash
        run: |
          {
            echo "### 规则集更新结果"
            echo
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "- 有更新，已提交"
            else
              echo "- 无变化，未产生提交"
            fi
            echo "- cnb.cool 同步由独立的 sync-cnb workflow 负责"
            echo "- Release 规则集（固定，滚动覆盖）：https://github.com/laincat/Rules/releases/latest/download/rulesets.tar.gz"
            echo "- Release 模块包（固定，滚动覆盖）：https://github.com/laincat/Rules/releases/latest/download/modules.tar.gz"
          } >> "$GITHUB_STEP_SUMMARY"
