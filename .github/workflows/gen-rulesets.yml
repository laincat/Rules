name: 生成规则集（Ozon / AI / 去广告）

# 每天抓上游、重算规则集，有变化就自动提交、滚动发布 Release、同步 CNB。
# 与 docs-watch.yml 的分工: 那边只回答「上游变了没有」（开 issue 等人判断）,
# 这边数据是纯机械合并（去重/清洗），变化本身就是可接受的结果，所以直接提交。

on:
  schedule:
    # 每天一次，避开整点（GitHub cron 整点丢槽）；比 docs-watch 晚 25 分钟，错峰
    - cron: "42 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_rulesets.py"
      - "tools/gen_diff.py"
      - "tools/gen_diff_chart.py"
      - ".github/workflows/gen-rulesets.yml"

permissions:
  contents: write

concurrency:
  group: gen-rulesets
  cancel-in-progress: false

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # 未配置时为空 → 下面的 CNB 同步步骤自动跳过
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      CNB_USER: ${{ secrets.CNB_USER }}
      CNB_REPO: laincat/Rules

    steps:
      - name: 取出仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 0          # 算 diff 需要上一版历史

      - name: 准备 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 下载 mihomo
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+' | head -1)"
          BASE="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}"
          curl -fsSL -o mihomo.gz "${BASE}/mihomo-linux-amd64-compatible-${VERSION}.gz"
          gzip -dc mihomo.gz > mihomo && chmod +x mihomo
          echo "MIHOMO=./mihomo" >> "$GITHUB_ENV"

      - name: 生成规则集
        shell: bash
        run: |
          set -euxo pipefail
          # --stamp 用北京时间写进文件头；内容未变时生成器会沿用旧时间戳（幂等）
          python tools/gen_rulesets.py --write --mihomo "$MIHOMO" --stamp "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')"

      - name: 计算差异（commit 前，对比 HEAD vs 工作区）
        id: diff
        shell: bash
        run: |
          set -euxo pipefail
          python tools/gen_diff.py --pre HEAD --out diff.json --md DIFF.md
          python tools/gen_diff_chart.py diff.json diff.svg
          echo "diag=$(cat DIFF.md)" >> "$GITHUB_OUTPUT" 2>/dev/null || true

      - name: 摘要
        shell: bash
        run: |
          {
            echo "### 规则集生成 $(date -u '+%Y-%m-%d')"
            echo
            echo '| 文件 | 条目 | 大小 |'
            echo '|---|---|---|'
            for f in Surge/Advertising/Advertising.list Surge/Advertising/Advertising.Extra.list Surge/Advertising/Comics.list \
                     Surge/Ruleset/AI.list Surge/Ruleset/AI.Extra.list \
                     Surge/Ruleset/Ozon.list Surge/Ruleset/Ozon.Extra.list \
                     Mihomo/Ruleset/AI.Extra.yaml Mihomo/Ruleset/Ozon.Extra.yaml \
                     Mihomo/Advertising/Advertising.Extra.yaml Mihomo/Advertising/Comic.yaml; do
              n="$(grep -cEv '^\s*(#|$)' "$f" || true)"
              s="$(wc -c < "$f")"
              echo "| \`$f\` | $n | ${s}B |"
            done
            for f in Mihomo/Advertising/Advertising.mrs Mihomo/Ruleset/AI.mrs Mihomo/Ruleset/Ozon.mrs; do
              s="$(wc -c < "$f")"
              echo "| \`$f\` | — | ${s}B |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交并推送
        id: commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Surge/Ruleset Surge/Advertising Mihomo/Ruleset Mihomo/Advertising
          if git diff --cached --quiet; then
            echo "规则集无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(ruleset): 自动刷新规则集 $(date -u '+%Y-%m-%d')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 滚动发布 Release（固定 tag，永远只留一个）
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="latest"

          exists=false
          if gh release view "$TAG" >/dev/null 2>&1; then exists=true; fi
          have=""
          if [ "$exists" = "true" ]; then
            have=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
                     --jq '.assets[] | select(.name=="rulesets.tar.gz") | (.digest // "")' \
                     2>/dev/null | sed 's|^sha256:||' || true)
          fi
          if [ "$exists" = "true" ] && [ "$have" = "$want" ]; then
            echo "Release 附件内容未变（sha256 ${want:0:16}…），跳过"
            exit 0
          fi

          # 打包规则集为 release asset
          mkdir -p release-assets
          cp -r Surge release-assets/Surge
          cp -r Mihomo release-assets/Mihomo
          cp diff.svg release-assets/ 2>/dev/null || true
          cp DIFF.md release-assets/ 2>/dev/null || true
          (cd release-assets && tar czf ../rulesets.tar.gz Surge Mihomo)

          want=$(sha256sum rulesets.tar.gz | awk '{print $1}')

          SHA=$(git rev-parse HEAD)
          git tag -f "$TAG" "$SHA"
          git push -f origin "refs/tags/$TAG"

          if [ "$exists" = "true" ]; then
            gh release upload "$TAG" rulesets.tar.gz diff.svg DIFF.md --clobber
            echo "已滚动覆盖 release assets（tag $TAG -> ${SHA:0:7}）"
          else
            gh release create "$TAG" rulesets.tar.gz diff.svg DIFF.md \
              --title "最新规则集（滚动更新）" \
              --notes "本 release 的 tag 固定为 latest，其下的规则集打包文件在每次内容变化后被覆盖。固定下载地址：https://github.com/laincat/Rules/releases/download/latest/rulesets.tar.gz" \
              --latest
            echo "已创建 release：$TAG"
          fi

      - name: 同步到 cnb.cool（没配 secret 就跳过）
        if: ${{ env.CNB_TOKEN != '' }}
        shell: bash
        run: |
          set -euxo pipefail
          CRED='!f() { echo "username='"${CNB_USER}"'"; echo "password='"${CNB_TOKEN}"'"; }; f'
          rm -rf /tmp/cnb-mirror
          git -c credential.helper= -c credential.helper="$CRED" \
              clone -q "https://cnb.cool/${CNB_REPO}.git" /tmp/cnb-mirror
          cp -r Surge /tmp/cnb-mirror/Surge
          cp -r Mihomo /tmp/cnb-mirror/Mihomo
          cp -r tools /tmp/cnb-mirror/tools
          cp README.md /tmp/cnb-mirror/README.md 2>/dev/null || true
          cd /tmp/cnb-mirror
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "cnb.cool 侧已是最新，无需同步"
            exit 0
          fi
          git commit -q -m "chore(rules): 同步自 GitHub Actions $(date -u '+%Y-%m-%d')"
          git -c credential.helper= -c credential.helper="$CRED" push -q origin HEAD:main
          echo "已同步到 cnb.cool/${CNB_REPO}"

      - name: 小结
        if: always()
        shell: bash
        run: |
          {
            echo "### 规则集更新结果"
            echo
            if [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "- 有更新，已提交"
            else
              echo "- 无变化，未产生提交"
            fi
            echo "- cnb.cool 同步：${{ env.CNB_TOKEN != '' && '已启用' || '未配置（跳过）' }}"
            echo "- Release 地址（固定，滚动覆盖）：https://github.com/laincat/Rules/releases/download/latest/rulesets.tar.gz"
          } >> "$GITHUB_STEP_SUMMARY"
