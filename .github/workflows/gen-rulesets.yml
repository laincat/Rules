name: 生成规则集（Ozon / AI / 去广告）

# 每天抓上游、重算规则集，有变化就自动提交、滚动发布 Release。
# CNB 镜像同步由独立的 sync-cnb.yml 负责，任何 main 提交都会触发。
# 与 docs-watch.yml 的分工: 那边只回答「上游变了没有」（开 issue 等人判断）,
# 这边数据是纯机械合并（去重/清洗），变化本身就是可接受的结果，所以直接提交。

on:
  schedule:
    # 每天一次，避开整点（GitHub cron 整点丢槽）；比 docs-watch 晚 25 分钟，错峰
    - cron: "42 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/gen_rulesets.py"
      - "tools/rule_validation.py"
      - "tools/tests/**"
      - "tools/gen_diff.py"
      - "tools/release_snapshot.py"
      - "tools/gen_diff_chart.py"
      - ".github/workflows/gen-rulesets.yml"

permissions:
  contents: read

concurrency:
  group: gen-rulesets
  cancel-in-progress: false

jobs:
  gen:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0          # 算 diff 需要上一版历史

      - name: 准备 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: 安装文档示例校验依赖
        run: python -m pip install -r tools/tests/requirements.txt

      - name: 校验清洗与误拦截保护
        run: python -m unittest discover -s tools/tests -v

      - name: 下载 mihomo
        id: download
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="v1.19.32"
          SHA256="ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20"
          BASE="https://github.com/MetaCubeX/mihomo/releases/download/${VERSION}"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o mihomo.gz "${BASE}/mihomo-linux-amd64-compatible-${VERSION}.gz"
          echo "${SHA256}  mihomo.gz" | sha256sum --check --strict
          gzip -dc mihomo.gz > mihomo && chmod +x mihomo
          echo "MIHOMO=./mihomo" >> "$GITHUB_ENV"

      - name: 生成规则集
        id: generate
        shell: bash
        run: |
          set -euxo pipefail
          # --mihomo 同时负责 Kelee 原生 HTTP provider 下载与 .mrs 编译。
          # [source-core] 日志证明 fresh cache 下载成功；403/解析失败会终止本轮生成。
          # --stamp 用北京时间写进文件头；内容未变时生成器会沿用旧时间戳（幂等）
          python tools/gen_rulesets.py --write --mihomo "$MIHOMO" --stamp "$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" --report "$RUNNER_TEMP/rules-validation.json" 2>&1 | tee "$RUNNER_TEMP/rules-generation.log"
          cat "$RUNNER_TEMP/rules-validation.json"
          {
            echo "### Kelee 原生核心下载验证"
            echo '```text'
            grep -E '^\[source-core\]|^\[kelee\]' "$RUNNER_TEMP/rules-generation.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 计算差异（commit 前，对比 HEAD vs 工作区）
        id: diff
        shell: bash
        run: |
          set -euxo pipefail
          python tools/gen_diff.py --pre HEAD --out diff.json --md DIFF.md
          # 差异直接写进下方 release 的说明文字，不再依赖 diff.svg 附件。

      - name: 摘要
        shell: bash
        run: |
          {
            echo "### 规则集生成 $(date -u '+%Y-%m-%d')"
            echo
            echo '| 文件 | 条目 | 大小 |'
            echo '|---|---|---|'
            for f in Surge/Advertising/Advertising.Reject.list Surge/Advertising/Advertising.RejectExtra.list \
                     Surge/Advertising/Advertising.Drop.list Surge/Advertising/Advertising.NonIP.list \
                     Surge/Advertising/Advertising.NoDrop.list Surge/Advertising/Advertising.IP.list \
                     Surge/Ruleset/AI.list Surge/Ruleset/AI.Extra.list \
                     Surge/Ruleset/Ozon.list Surge/Ruleset/Ozon.Extra.list \
                     Mihomo/Ruleset/AI.Extra.yaml Mihomo/Ruleset/Ozon.Extra.yaml \
                     Mihomo/Advertising/Advertising.Drop.yaml \
                     Mihomo/Advertising/Advertising.NonIP.yaml \
                     Mihomo/Advertising/Advertising.NoDrop.yaml \
                     Mihomo/Advertising/Advertising.IP.yaml; do
              n="$(grep -cEv '^\s*(#|$)' "$f" || true)"
              s="$(wc -c < "$f")"
              echo "| \`$f\` | $n | ${s}B |"
            done
            for f in Mihomo/Advertising/Advertising.Reject.mrs \
                     Mihomo/Advertising/Advertising.RejectExtra.mrs \
                     Mihomo/Ruleset/AI.mrs Mihomo/Ruleset/Ozon.mrs; do
              s="$(wc -c < "$f")"
              echo "| \`$f\` | — | ${s}B |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 打包构建快照（保留目录和隐藏文件）
        run: |
          tar -cf generated-rules.tar Surge/Advertising Surge/Ruleset Mihomo/Advertising Mihomo/Ruleset DIFF.md diff.json
      - name: 保存构建产物（只读构建无推送凭据）
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-rules
          if-no-files-found: error
          retention-days: 1
          path: generated-rules.tar

  publish:
    needs: gen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: generated-rules
          path: .

      - name: 恢复完整构建快照
        run: |
          python tools/restore_generated.py generated-rules.tar
          rm generated-rules.tar

      - name: 提交并推送
        id: commit
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "publishable=false" >> "$GITHUB_OUTPUT"
          git add -A Surge/Ruleset Surge/Advertising Mihomo/Ruleset Mihomo/Advertising
          if git diff --cached --quiet; then
            git fetch origin main
            git merge --ff-only origin/main
            echo "规则集无变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(ruleset): 自动刷新规则集 $(date -u '+%Y-%m-%d')"
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "rebase 冲突，本轮未发布；需要重试"
              exit 1
            fi
            if git push origin HEAD:main; then pushed=true; break; fi
            sleep "$((attempt * 2))"
          done
          [ "$pushed" = true ] || { echo "push 失败，本轮未发布"; exit 1; }
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "publishable=true" >> "$GITHUB_OUTPUT"

      - name: 滚动发布 Release（固定 tag，永远只留一个）
        id: release
        if: steps.commit.outputs.publishable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          TAG="latest"

          # 附件 = 单个文件本身（扁平文件名，可直接用 latest/download/<文件名> 引用）；
          # 保留两个 tar.gz 仅供习惯整包下载的人，不再作为主要引用方式。
          mkdir -p release-assets
          mapfile -t FILES < <(git ls-files Surge/Advertising Surge/Ruleset Surge/Module \
                                           Mihomo/Advertising Mihomo/Ruleset \
                               | grep -v '/readme\.md$' | sort)
          if [ "${#FILES[@]}" -lt 20 ]; then
            echo "附件文件数异常（${#FILES[@]}），拒绝发布"
            exit 1
          fi
          # 文件名在全部产物里唯一，才敢用扁平名；否则同名会互相覆盖。
          dup=$(printf '%s\n' "${FILES[@]##*/}" | sort | uniq -d)
          if [ -n "$dup" ]; then
            echo "发现同名文件，扁平附件名会互相覆盖："
            echo "$dup"
            exit 1
          fi
          for f in "${FILES[@]}"; do cp "$f" "release-assets/${f##*/}"; done
          ls release-assets | wc -l
          (
            cd Surge && tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cf ../release-assets/Surge.tar Module
          )
          (cd release-assets && gzip -n -c Surge.tar > modules.tar.gz && rm Surge.tar)
          mkdir -p release-assets/Rulesets/Surge release-assets/Rulesets/Mihomo
          cp -r Surge/Advertising Surge/Ruleset release-assets/Rulesets/Surge/
          cp -r Mihomo/Advertising Mihomo/Ruleset release-assets/Rulesets/Mihomo/
          (cd release-assets/Rulesets && tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf - Mihomo Surge | gzip -n > ../rulesets.tar.gz)
          rm -rf release-assets/Rulesets
          python tools/release_snapshot.py build release-assets --source "$(git rev-parse HEAD)"

          exists=false
          if gh release view "$TAG" >/dev/null 2>&1; then exists=true; fi

          # 清理当前产物清单之外的所有旧附件：分片重构、改名或删除后，
          # latest/download/<旧名> 不允许再返回已过期内容。
          if [ "$exists" = "true" ]; then
            mapfile -t CURRENT < <(printf '%s\n' "${FILES[@]##*/}" modules.tar.gz rulesets.tar.gz snapshot-manifest.json | sort -u)
            while IFS= read -r stale; do
              [ -n "$stale" ] || continue
              if ! printf '%s\n' "${CURRENT[@]}" | grep -qx "$stale"; then
                gh release delete-asset "$TAG" "$stale" --yes
                echo "已删除过期附件 $stale"
              fi
            done < <(gh release view "$TAG" --json assets --jq '.assets[].name')
          fi

          # 逐个比对已有附件 digest，只上传内容变了的（GitHub 用 sha256 比对，
          # 内容不变时不产生新附件、不换新下载链接）。
          release_json="$RUNNER_TEMP/release-before.json"
          if [ "$exists" = "true" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$release_json"
          else
            echo '{"assets":[]}' > "$release_json"
          fi
          jq -e '(.assets | type) == "array"' "$release_json" >/dev/null
          digest() {
            jq -r --arg name "$1" '[.assets[] | select(.name==$name) | (.digest // "")] | first // ""' "$release_json" | sed 's|^sha256:||'
          }

          uploads=()
          for f in "${FILES[@]}"; do
            name="${f##*/}"
            want=$(sha256sum "$f" | awk '{print $1}')
            if [ "$exists" != "true" ] || [ "$(digest "$name")" != "$want" ]; then
              uploads+=("release-assets/$name")
            fi
          done
          for extra in modules.tar.gz rulesets.tar.gz snapshot-manifest.json; do
            want=$(sha256sum "release-assets/$extra" | awk '{print $1}')
            if [ "$exists" != "true" ] || [ "$(digest "$extra")" != "$want" ]; then
              uploads+=("release-assets/$extra")
            fi
          done
          if [ "${#uploads[@]}" -eq 0 ]; then
            echo "全部附件内容未变，跳过"
            exit 0
          fi

          # 发行版说明用的文件清单（路径 + 附件名）
          : > release-files.txt
          for f in "${FILES[@]}"; do printf '%s|\n' "$f" >> release-files.txt; done

          SHA=$(git rev-parse HEAD)
          git tag -f "$TAG" "$SHA"
          git push -f origin "refs/tags/$TAG"

          # 发行版说明 = 固定说明 + 本次差异报告正文。
          # --notes-file 读文件、不经过 shell 转义，多行 markdown 原样保留。
          {
            echo "本 Release 的 tag 固定为 \`latest\`，**每个规则文件都是独立附件**，"
            echo "可直接用下面的固定地址引用（文件名即仓库里的文件名）："
            echo
            echo '```'
            echo "https://github.com/laincat/Rules/releases/latest/download/Advertising.sgmodule"
            echo "https://github.com/laincat/Rules/releases/latest/download/Advertising.Reject.list"
            echo "https://github.com/laincat/Rules/releases/latest/download/Advertising.RejectExtra.list"
            echo "https://github.com/laincat/Rules/releases/latest/download/Advertising.Drop.list"
            echo "https://github.com/laincat/Rules/releases/latest/download/Advertising.NonIP.list"
            echo "https://github.com/laincat/Rules/releases/latest/download/Advertising.NoDrop.list"
            echo "https://github.com/laincat/Rules/releases/latest/download/Advertising.IP.list"
            echo '```'
            echo
            echo '| 文件 | 说明 |'
            echo '|---|---|'
            while IFS='|' read -r f desc; do
              [ -n "$f" ] || continue
              echo "| [\`${f##*/}\`](https://github.com/laincat/Rules/releases/latest/download/${f##*/}) | \`$f\` |"
            done < release-files.txt
            echo
            echo "整包（可选，非主要引用方式）：\`modules.tar.gz\`（Surge 模块）、"
            echo "\`rulesets.tar.gz\`（规则集，压缩包内保留 \`Surge/\` / \`Mihomo/\` 目录）。"
            echo
            echo "内容变化的附件才会被覆盖；未变化的保留原附件。"
            echo
            echo "---"
            echo
            cat DIFF.md
          } > release-notes.md

          if [ "$exists" = "true" ]; then
            # Commit marker is always last, after all data uploads succeed.
            for asset in "${uploads[@]}"; do
              [ "${asset##*/}" = snapshot-manifest.json ] && continue
              gh release upload "$TAG" "$asset" --clobber
            done
            gh release upload "$TAG" release-assets/snapshot-manifest.json --clobber
            gh release edit "$TAG" --notes-file release-notes.md
            echo "已滚动覆盖 release（tag $TAG -> ${SHA:0:7}），更新附件 ${#uploads[@]} 个"
          else
            gh release create "$TAG" release-assets/* \
              --title "最新规则集（滚动更新）" \
              --notes-file release-notes.md \
              --latest
            echo "已创建 release：$TAG"
          fi

      - name: 小结
        if: always()
        shell: bash
        run: |
          {
            echo "### 规则集更新结果"
            echo
            echo "- 只读构建：${{ needs.gen.result }}"
            echo "- 提交并推送：${{ steps.commit.outcome }}"
            echo "- GitHub Release：${{ steps.release.outcome }}"
            if [ "${{ job.status }}" != "success" ]; then
              echo "- 本轮未完整完成；请查看上方失败步骤，Release 未必已更新。"
            elif [ "${{ steps.commit.outputs.changed }}" = "true" ]; then
              echo "- 有更新，已提交"
            elif [ "${{ steps.commit.outputs.publishable }}" = "true" ]; then
              echo "- 生成与发布流程已完成，规则无差异，未产生提交"
            else
              echo "- 生成已完成，但提交或推送未完成；Release 未更新"
            fi
            echo "- cnb.cool 同步由独立的 sync-cnb workflow 负责"
            echo "- Release 规则集（固定，滚动覆盖）：https://github.com/laincat/Rules/releases/latest/download/rulesets.tar.gz"
            echo "- Release 模块包（固定，滚动覆盖）：https://github.com/laincat/Rules/releases/latest/download/modules.tar.gz"
          } >> "$GITHUB_STEP_SUMMARY"


