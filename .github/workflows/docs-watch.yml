name: 更新日志自动生成

# Surge/Changelog only mirrors Telegram @SurgeTestFlightFeed.
# Mihomo/Changelog only summarizes and translates Alpha branch commits.

on:
  schedule:
    # Daily keeps the rolling seven-day window fresh and recovers missed runs.
    - cron: "17 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/docs_watch.py"
      - "tools/tests/test_docs_watch.py"
      - "tools/tests/test_docs_structure.py"
      - ".github/workflows/docs-watch.yml"

permissions:
  contents: write

concurrency:
  group: changelog-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 取出仓库
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: 准备 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: 验证更新日志生成器
        run: python -m unittest discover -s tools/tests -p 'test_docs_*.py'

      - name: 生成中文更新日志
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/docs_watch.py

      - name: 提交并推送
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Surge/Changelog Mihomo/Changelog
          if git diff --cached --quiet; then
            echo "更新日志无变化"
            exit 0
          fi
          git commit -m "chore(changelog): 刷新自动更新日志 $(date -u '+%Y-%m-%d')"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep "$((attempt * 2))"
          done
          exit 1
